<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Accounts List - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: white;
            padding: 20px;
            border-bottom: 5px solid #ffc107;
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table th, table td {
            font-size: 14px;
            vertical-align: middle !important;
        }
        .bank-title-col {
            min-width: 240px;
            white-space: normal !important;
            word-break: break-word;
        }
        .bank-name-col {
            min-width: 200px;
            white-space: normal !important;
            word-break: break-word;
        }
        .footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-landmark text-warning"></i> Bank Accounts List</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Content Section -->
    <div class="container-fluid my-4 px-3">
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4">
            <div class="table-responsive p-0">
                <table class="table table-bordered table-striped align-middle mb-0" style="min-width: 800px;">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 8%;">Sr.No.</th>
                            <th class="bank-title-col">Title of Account</th>
                            <th style="width: 22%;">Account No.</th>
                            <th class="bank-name-col">Bank</th>
                            <th style="width: 14%;" class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="bankTableBody">
                        <!-- Data loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-3 p-3 bg-white rounded-4">
            <h6 class="fw-bold text-dark mb-2" id="bankFormTitle"><i class="fa-solid fa-circle-plus"></i> Add New Bank Account</h6>
            <form id="bankForm" class="row g-2">
                <input type="hidden" id="bankEditKey">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm" id="bankTitle" required placeholder="Title of Account">
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm" id="bankAccNo" required placeholder="Account No.">
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm" id="bankName" required placeholder="Bank Name">
                </div>
                <div class="col-12 text-end mt-2">
                    <button type="submit" class="btn btn-warning btn-sm text-dark px-4 rounded-pill fw-semibold" id="bankSaveBtn">
                        <i class="fa-solid fa-save"></i> Save Bank Account
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const bankForm = document.getElementById('bankForm');
        const bankTableBody = document.getElementById('bankTableBody');

        bankForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const editKey = document.getElementById('bankEditKey').value;
            const title = document.getElementById('bankTitle').value;
            const accNo = document.getElementById('bankAccNo').value;
            const bankName = document.getElementById('bankName').value;

            const bankData = { title, accNo, bankName };

            if (editKey === "") {
                const newRef = push(ref(db, 'bank_accounts'));
                set(newRef, bankData).then(() => { bankForm.reset(); }).catch((err) => alert(err.message));
            } else {
                set(ref(db, 'bank_accounts/' + editKey), bankData).then(() => {
                    bankForm.reset();
                    document.getElementById('bankEditKey').value = "";
                    document.getElementById('bankFormTitle').innerHTML = '<i class="fa-solid fa-circle-plus"></i> Add New Bank Account';
                    document.getElementById('bankSaveBtn').innerHTML = '<i class="fa-solid fa-save"></i> Save Bank Account';
                }).catch((err) => alert(err.message));
            }
        });

        onValue(ref(db, 'bank_accounts'), (snapshot) => {
            const data = snapshot.val();
            bankTableBody.innerHTML = '';
            if (data) {
                let index = 1;
                Object.keys(data).forEach((key) => {
                    const b = data[key];
                    bankTableBody.innerHTML += `<tr>
                        <td class="fw-bold">${index++}</td>
                        <td class="bank-title-col"><strong>${b.title}</strong></td>
                        <td style="white-space: nowrap;"><code>${b.accNo}</code></td>
                        <td class="bank-name-col">${b.bankName}</td>
                        <td class="text-center" style="white-space: nowrap;">
                            <div class="d-flex flex-column gap-1">
                                <button class="btn btn-warning btn-sm text-dark px-2 py-0 fw-semibold" onclick="editBank('${key}', '${b.title}', '${b.accNo}', '${b.bankName}')">Edit</button>
                                <button class="btn btn-danger btn-sm px-2 py-0 fw-semibold" onclick="deleteBank('${key}')">Del</button>
                            </div>
                        </td>
                    </tr>`;
                });
            } else {
                bankTableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">No bank accounts found. Add manually below.</td></tr>`;
            }
        });

        window.deleteBank = (key) => {
            if (confirm("Delete this bank account?")) remove(ref(db, 'bank_accounts/' + key));
        };

        window.editBank = (key, title, accNo, bankName) => {
            document.getElementById('bankEditKey').value = key;
            document.getElementById('bankTitle').value = title;
            document.getElementById('bankAccNo').value = accNo;
            document.getElementById('bankName').value = bankName;
            document.getElementById('bankFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Bank Account';
            document.getElementById('bankSaveBtn').innerHTML = '<i class="fa-solid fa-sync"></i> Update Bank Account';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        };
    </script>
</body>
</html>
