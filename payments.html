<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Account - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-section { background: linear-gradient(135deg, #0f5132, #198754); color: white; padding: 20px; border-bottom: 5px solid #ffc107; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table th, table td { font-size: 11px !important; vertical-align: middle !important; padding: 6px 4px !important; }
        .form-control-sm, .form-select-sm { font-size: 11px !important; padding: 2px 4px !important; }
        .editable-cell { cursor: pointer; user-select: none; }
        .editable-cell:hover { background-color: #e9ecef !important; }
        .edit-input { width: 100%; font-size: 11px; padding: 2px 4px; box-sizing: border-box; }
        
        /* Updated Column Widths */
        .sr-col { width: 4% !important; text-align: center; }
        .date-col { width: 7% !important; max-width: 7% !important; min-width: 70px; white-space: nowrap; text-align: center; overflow: hidden; }
        .date-col input { font-size: 7px !important; padding: 1px 0px !important; text-align: center; }
        .desc-col { width: 20%; min-width: 110px; white-space: normal !important; word-break: break-word; }
        .receiver-col { width: 19%; min-width: 110px; white-space: normal !important; word-break: break-word; }
        .amount-col { width: 9% !important; min-width: 80px; text-align: right; }
        .method-col { width: 8% !important; min-width: 70px; text-align: center; }
        .account-col { width: 18%; min-width: 115px; white-space: normal !important; word-break: break-word; }
        .action-col { width: 7% !important; text-align: center; }

        .footer { background-color: #212529; color: #adb5bd; padding: 20px 0; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-money-bill-transfer text-warning"></i> Payments Account</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>

    <!-- Container Width (950px) -->
    <div class="container-fluid my-4 px-3" style="max-width: 950px;">
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3 flex-wrap gap-2">
                <h5 class="mb-0"><i class="fa-solid fa-book-open text-warning"></i> Payments List & Entry</h5>
                <span class="badge bg-warning text-dark"><i class="fa-solid fa-hand-pointer"></i> Double-click any cell to edit & auto-save</span>
            </div>
            
            <div class="table-responsive p-1">
                <table class="table table-bordered table-striped align-middle mb-0" style="min-width: 850px;">
                    <thead class="table-secondary text-center">
                        <tr>
                            <th class="sr-col">Sr.No.</th>
                            <th class="date-col">Date</th>
                            <th class="desc-col">Description</th>
                            <th class="receiver-col">Paid To / Receiver</th>
                            <th class="amount-col">Amount Sent</th>
                            <th class="method-col">Method</th>
                            <th class="account-col">From Account</th>
                            <th class="action-col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="paymentTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container"><p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        let accountsList = [];

        onValue(ref(db, 'bank_accounts'), (snap) => {
            accountsList = [];
            if (snap.val()) Object.keys(snap.val()).forEach(k => accountsList.push(`${snap.val()[k].title} (${snap.val()[k].bankName})`));
        });

        onValue(ref(db, 'payments'), (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('paymentTableBody');
            tbody.innerHTML = '';

            if (data) {
                let index = 1;
                Object.keys(data).forEach(k => {
                    const item = data[k];
                    const amt = parseFloat(item.amount) || 0;
                    const receiverName = item.receiver || item.customer || '-';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-center fw-bold sr-col">${index++}</td>
                        <td class="text-center editable-cell date-col" data-id="${k}" data-field="date" data-val="${item.date || ''}">${item.date || '-'}</td>
                        <td class="editable-cell desc-col" data-id="${k}" data-field="description" data-val="${item.description || ''}">${item.description || '-'}</td>
                        <td class="editable-cell receiver-col" data-id="${k}" data-field="receiver" data-val="${receiverName}">${receiverName}</td>
                        <td class="text-end text-danger fw-semibold editable-cell amount-col" data-id="${k}" data-field="amount" data-val="${amt}">${amt ? amt.toLocaleString() : '0'}</td>
                        <td class="text-center editable-cell method-col" data-id="${k}" data-field="method" data-val="${item.method || ''}">${item.method || '-'}</td>
                        <td class="editable-cell account-col" data-id="${k}" data-field="account" data-val="${item.account || ''}">${item.account || '-'}</td>
                        <td class="text-center action-col"><button class="btn btn-danger btn-sm py-0 px-2 delete-btn" data-id="${k}"><i class="fa-solid fa-trash"></i></button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            const inputTr = document.createElement('tr');
            inputTr.className = "table-light";
            inputTr.innerHTML = `
                <td class="text-center text-muted fw-bold sr-col">+</td>
                <td class="date-col"><input type="date" class="form-control form-control-sm" id="inputDate" value="${new Date().toISOString().split('T')[0]}"></td>
                <td class="desc-col"><input type="text" class="form-control form-control-sm" id="inputDesc" placeholder="Expense / Salary / Rent"></td>
                <td class="receiver-col">
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control" id="inputReceiver" placeholder="Type or select">
                        <select class="form-select" id="receiverSelect" style="max-width: 40px; padding: 0 4px;"><option value="" selected disabled></option></select>
                    </div>
                </td>
                <td class="amount-col"><input type="number" class="form-control form-control-sm text-end" id="inputAmount" placeholder="Amount"></td>
                <td class="method-col"><select class="form-select form-select-sm" id="inputMethod"><option value="Cash">Cash</option><option value="Cheque">Cheque</option><option value="Card">Card</option><option value="Other">Other</option></select></td>
                <td class="account-col"><select class="form-select form-select-sm" id="inputAccount"><option value="" selected disabled>-- From Account --</option></select></td>
                <td class="text-center action-col"><button class="btn btn-danger btn-sm py-1 px-2 fw-bold" id="addBtn">Add</button></td>
            `;
            tbody.appendChild(inputTr);

            const recSelect = document.getElementById('receiverSelect'), recInput = document.getElementById('inputReceiver'), accSelect = document.getElementById('inputAccount');
            accountsList.forEach(acc => {
                recSelect.appendChild(new Option(acc, acc));
                accSelect.appendChild(new Option(acc, acc));
            });
            recSelect.addEventListener('change', (e) => recInput.value = e.target.value);

            document.getElementById('addBtn').addEventListener('click', () => {
                const date = document.getElementById('inputDate').value;
                const receiver = recInput.value.trim();
                const amount = parseFloat(document.getElementById('inputAmount').value) || 0;
                const method = document.getElementById('inputMethod').value;
                const account = document.getElementById('inputAccount').value;
                const description = document.getElementById('inputDesc').value || 'Payment Expense';

                if (!receiver || amount <= 0 || !account) { alert("Baraye karam Receiver, Amount aur Account zaroor enter/select karein!"); return; }
                push(ref(db, 'payments'), { date, receiver, amount, method, account, description });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (confirm("Kya aap is payment entry ko delete karna chahte hain?")) remove(ref(db, `payments/${e.currentTarget.getAttribute('data-id')}`));
                });
            });

            document.querySelectorAll('.editable-cell').forEach(cell => {
                cell.addEventListener('dblclick', () => {
                    if (cell.querySelector('input, select')) return;
                    const id = cell.getAttribute('data-id'), field = cell.getAttribute('data-field'), currentVal = cell.getAttribute('data-val') || '';
                    let inputEl = document.createElement('input');
                    inputEl.className = 'form-control form-control-sm edit-input';
                    if (field === 'date') inputEl.type = 'date', inputEl.value = currentVal;
                    else if (field === 'amount') inputEl.type = 'number', inputEl.value = currentVal;
                    else if (field === 'account' || field === 'method') {
                        inputEl = document.createElement('select');
                        inputEl.className = 'form-select form-select-sm edit-input';
                        let list = field === 'account' ? accountsList : ['Cash', 'Cheque', 'Card', 'Other'];
                        list.forEach(item => { const opt = new Option(item, item); if (item === currentVal) opt.selected = true; inputEl.appendChild(opt); });
                    } else inputEl.value = currentVal;

                    cell.innerHTML = ''; cell.appendChild(inputEl); inputEl.focus();
                    const save = () => {
                        const newVal = inputEl.value.trim();
                        if (newVal !== currentVal) update(ref(db, `payments/${id}`), { [field]: field === 'amount' ? (parseFloat(newVal) || 0) : newVal });
                        else cell.textContent = field === 'amount' ? parseFloat(currentVal).toLocaleString() : currentVal;
                    };
                    inputEl.addEventListener('blur', save);
                    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputEl.blur(); });
                });
            });
        });
    </script>
</body>
</html>
