<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Account - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: white;
            padding: 20px;
            border-bottom: 5px solid #ffc107;
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table th, table td {
            font-size: 11px !important;
            vertical-align: middle !important;
            padding: 4px 2px !important;
        }
        .form-control-sm, .form-select-sm {
            font-size: 11px !important;
            padding: 3px 4px !important;
        }
        .editable-cell {
            cursor: pointer;
            user-select: none;
        }
        .editable-cell:hover {
            background-color: #e9ecef !important;
        }
        .edit-input {
            width: 100%;
            font-size: 11px;
            padding: 2px 4px;
            box-sizing: border-box;
        }
        .footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-money-bill-transfer text-warning"></i> Payments Account</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Content Section -->
    <div class="container-fluid my-4 px-2" style="max-width: 1300px;">
        
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0"><i class="fa-solid fa-book-open text-warning"></i> Payments List & Entry (Expenses, Salary, Tax, Rent)</h5>
                <small class="text-warning"><i class="fa-solid fa-hand-pointer"></i> Double-click any cell to edit & auto-save</small>
            </div>
            
            <div class="table-responsive p-1">
                <table class="table table-bordered table-striped align-middle mb-0" style="min-width: 1050px;">
                    <thead class="table-secondary text-center">
                        <tr>
                            <th style="width: 5%;">Sr.No.</th>
                            <th style="width: 11%;">Date</th>
                            <th style="width: 22%;">Description</th>
                            <th style="width: 18%;">Paid To / Receiver</th>
                            <th style="width: 12%;">Amount Sent</th>
                            <th style="width: 10%;">Method</th>
                            <th style="width: 17%;">From Account</th>
                            <th style="width: 5%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="paymentTableBody">
                        <!-- Data rows will load on top, Input row will be at the bottom -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let accountsList = ["Cash in Hand"];

        onValue(ref(db, 'bank_accounts'), (snap) => {
            const data = snap.val();
            accountsList = ["Cash in Hand"];
            if (data) {
                Object.keys(data).forEach(k => {
                    const b = data[k];
                    accountsList.push(`${b.title} (${b.bankName})`);
                });
            }
        });

        // Load Payments Table
        onValue(ref(db, 'payments'), (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('paymentTableBody');
            tbody.innerHTML = '';

            if (data) {
                let index = 1;
                Object.keys(data).forEach(k => {
                    const item = data[k];
                    const amt = parseFloat(item.amount) || 0;
                    const receiverName = item.receiver || item.customer || '-';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-center fw-bold">${index++}</td>
                        <td class="text-center editable-cell" data-id="${k}" data-field="date" data-val="${item.date || ''}">${item.date || '-'}</td>
                        <td class="editable-cell" data-id="${k}" data-field="description" data-val="${item.description || ''}">${item.description || '-'}</td>
                        <td class="editable-cell" data-id="${k}" data-field="receiver" data-val="${receiverName}">${receiverName}</td>
                        <td class="text-end text-danger fw-semibold editable-cell" data-id="${k}" data-field="amount" data-val="${amt}">${amt ? amt.toLocaleString() : '0'}</td>
                        <td class="text-center editable-cell" data-id="${k}" data-field="method" data-val="${item.method || ''}">${item.method || '-'}</td>
                        <td class="editable-cell" data-id="${k}" data-field="account" data-val="${item.account || ''}">${item.account || '-'}</td>
                        <td class="text-center">
                            <button class="btn btn-danger btn-sm py-0 px-2 delete-btn" data-id="${k}"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Append Input Row at the BOTTOM
            const inputTr = document.createElement('tr');
            inputTr.className = "table-light";
            inputTr.innerHTML = `
                <td class="text-center text-muted fw-bold">+</td>
                <td><input type="date" class="form-control form-control-sm" id="inputDate" value="${new Date().toISOString().split('T')[0]}"></td>
                <td><input type="text" class="form-control form-control-sm" id="inputDesc" placeholder="e.g. Office Rent / Salary"></td>
                <td><input type="text" class="form-control form-control-sm" id="inputReceiver" placeholder="Paid To Name"></td>
                <td><input type="number" class="form-control form-control-sm" id="inputAmount" placeholder="Amount"></td>
                <td>
                    <select class="form-select form-select-sm" id="inputMethod">
                        <option value="Cash">Cash</option>
                        <option value="Cheque">Cheque</option>
                        <option value="Card">Card</option>
                        <option value="Other">Other</option>
                    </select>
                </td>
                <td>
                    <select class="form-select form-select-sm" id="inputAccount">
                        <option value="" selected disabled>-- From Account --</option>
                        <option value="Cash in Hand">Cash in Hand</option>
                    </select>
                </td>
                <td class="text-center">
                    <button class="btn btn-danger btn-sm py-1 px-3 fw-bold" id="addBtn">Add</button>
                </td>
            `;
            tbody.appendChild(inputTr);

            const accSelect = document.getElementById('inputAccount');
            accountsList.forEach(acc => {
                if (acc !== "Cash in Hand") {
                    const opt = document.createElement('option');
                    opt.value = acc;
                    opt.textContent = acc;
                    accSelect.appendChild(opt);
                }
            });

            // Add Payment Button Event
            document.getElementById('addBtn').addEventListener('click', () => {
                const date = document.getElementById('inputDate').value;
                const receiver = document.getElementById('inputReceiver').value.trim();
                const amount = parseFloat(document.getElementById('inputAmount').value) || 0;
                const method = document.getElementById('inputMethod').value;
                const account = document.getElementById('inputAccount').value;
                const description = document.getElementById('inputDesc').value || 'Payment Expense';

                if (!receiver || amount <= 0 || !account) {
                    alert("Baraye karam Paid To (Receiver), Amount aur Account zaroor enter/select karein!");
                    return;
                }

                const newEntry = { date, receiver, amount, method, account, description };
                push(ref(db, 'payments'), newEntry);
            });

            // Delete Event
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm("Kya aap is payment entry ko delete karna chahte hain?")) {
                        remove(ref(db, `payments/${id}`));
                    }
                });
            });

            // Attach Double Click Editing Events
            attachInlineEditEvents();
        });

        function attachInlineEditEvents() {
            document.querySelectorAll('.editable-cell').forEach(cell => {
                cell.addEventListener('dblclick', () => {
                    if (cell.querySelector('input, select')) return;

                    const id = cell.getAttribute('data-id');
                    const field = cell.getAttribute('data-field');
                    const currentVal = cell.getAttribute('data-val') || '';

                    let inputEl;
                    if (field === 'date') {
                        inputEl = document.createElement('input');
                        inputEl.type = 'date';
                        inputEl.className = 'form-control form-control-sm edit-input';
                        inputEl.value = currentVal;
                    } else if (field === 'account') {
                        inputEl = document.createElement('select');
                        inputEl.className = 'form-select form-select-sm edit-input';
                        accountsList.forEach(acc => {
                            const opt = document.createElement('option');
                            opt.value = acc;
                            opt.textContent = acc;
                            if (acc === currentVal) opt.selected = true;
                            inputEl.appendChild(opt);
                        });
                    } else if (field === 'method') {
                        inputEl = document.createElement('select');
                        inputEl.className = 'form-select form-select-sm edit-input';
                        ['Cash', 'Cheque', 'Card', 'Other'].forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m;
                            opt.textContent = m;
                            if (m === currentVal) opt.selected = true;
                            inputEl.appendChild(opt);
                        });
                    } else {
                        inputEl = document.createElement('input');
                        inputEl.type = field === 'amount' ? 'number' : 'text';
                        inputEl.className = 'form-control form-control-sm edit-input';
                        inputEl.value = currentVal;
                    }

                    cell.innerHTML = '';
                    cell.appendChild(inputEl);
                    inputEl.focus();

                    const saveChanges = () => {
                        const newVal = inputEl.value.trim();
                        if (newVal !== currentVal) {
                            const updateObj = {};
                            updateObj[field] = field === 'amount' ? (parseFloat(newVal) || 0) : newVal;
                            update(ref(db, `payments/${id}`), updateObj);
                        } else {
                            cell.textContent = field === 'amount' ? parseFloat(currentVal).toLocaleString() : currentVal;
                        }
                    };

                    inputEl.addEventListener('blur', saveChanges);
                    inputEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') inputEl.blur();
                    });
                });
            });
        }
    </script>
</body>
</html>
