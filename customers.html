<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Ledger - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: white;
            padding: 20px;
            border-bottom: 5px solid #ffc107;
        }
        .hidden-section {
            display: none !important;
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table th, table td {
            font-size: 12px !important;
            vertical-align: middle !important;
            padding: 6px 4px !important;
        }
        /* Column Widths */
        .sr-col { width: 5% !important; text-align: center; }
        .date-col { width: 12% !important; white-space: nowrap; text-align: center; }
        .desc-col { width: 22%; min-width: 130px; white-space: normal !important; word-break: break-word; }
        .rec-col { width: 15% !important; text-align: right; }
        .method-col { width: 12% !important; text-align: center; }
        .acc-col { width: 20%; min-width: 130px; white-space: normal !important; word-break: break-word; }
        .rem-col { width: 14% !important; text-align: right; }

        .footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-users text-warning"></i> Customer Ledger</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Content Section -->
    <div class="container-fluid my-4 px-3" style="max-width: 100%;">
        
        <!-- Dropdown Card to Select Customer -->
        <div class="card shadow-sm border-0 bg-white rounded-4 p-3 mb-3">
            <h5 class="fw-bold text-primary mb-2"><i class="fa-solid fa-user-check"></i> Select Customer</h5>
            <div class="mb-0">
                <label for="customerDropdown" class="form-label fw-semibold text-muted">Choose a customer from the list to view ledger:</label>
                <select class="form-select form-select-lg" id="customerDropdown">
                    <option value="" selected disabled>-- Select a Customer --</option>
                </select>
            </div>
        </div>

        <!-- Customer Ledger Table Section -->
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4 hidden-section" id="ledgerSection">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 text-truncate" id="selectedCustomerTitle"><i class="fa-solid fa-book text-warning"></i> Customer Transactions</h5>
            </div>
            
            <div class="table-responsive p-1">
                <table class="table table-bordered table-striped align-middle mb-0" style="min-width: 850px;">
                    <thead class="table-secondary text-center">
                        <tr>
                            <th class="sr-col">Sr.No.</th>
                            <th class="date-col">Date</th>
                            <th class="desc-col">Description</th>
                            <th class="rec-col">Amount<br>Received</th>
                            <th class="method-col">Method</th>
                            <th class="acc-col">Account</th>
                            <th class="rem-col">Total</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerTableBody">
                        <!-- Dynamic rows will load here automatically -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const customerDropdown = document.getElementById('customerDropdown');
        const ledgerSection = document.getElementById('ledgerSection');
        const selectedCustomerTitle = document.getElementById('selectedCustomerTitle');
        const ledgerTableBody = document.getElementById('ledgerTableBody');

        let globalDbData = null;
        let selectedCustomerId = "";

        // Format date from yyyy-mm-dd to dd-mm-yyyy
        function formatDateToDisplay(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }

        // Helper to separate Method (Cash / Bank / Cheque) and Account detail accurately
        function extractMethodAndAccount(rawMethod, rawAccount) {
            const methodVal = (rawMethod || '').trim();
            const accountVal = (rawAccount || '').trim();

            if (!methodVal && !accountVal) {
                return { methodType: '-', accountName: '-' };
            }
            
            if (methodVal.toLowerCase() === 'cash' || accountVal.toLowerCase().includes('cash in hand')) {
                return { methodType: 'Cash', accountName: 'Cash in Hand' };
            }
            
            // Properly map the method and account without mixing them up
            return { 
                methodType: methodVal || 'Bank', 
                accountName: accountVal || '-' 
            };
        }

        // Helper to check if a transaction record belongs to the selected customer
        function isCustomerMatch(item, selectedId, custNameLower, custCodeLower, fullTitleLower) {
            const itemCustId = item.customerId || item.customerKey || item.customer_id || '';
            if (itemCustId && itemCustId === selectedId) return true;

            const senderStr = (item.sender || item.customerName || item.customer || item.party || item.name || item.title || '').trim().toLowerCase();
            if (!senderStr) return false;

            return (custNameLower && senderStr.includes(custNameLower)) ||
                   (custCodeLower && senderStr.includes(custCodeLower)) ||
                   (senderStr === fullTitleLower);
        }

        // 1. Load Customers into Dropdown
        onValue(ref(db, 'customers'), (snapshot) => {
            const data = snapshot.val();
            customerDropdown.innerHTML = '<option value="" selected disabled>-- Select a Customer --</option>';
            if (data) {
                Object.keys(data).forEach(key => {
                    const c = data[key];
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `[${c.code || 'N/A'}] ${c.name}`;
                    customerDropdown.appendChild(option);
                });
            }
        });

        // 2. Listen to entire database for live updates
        onValue(ref(db, '/'), (snapshot) => {
            globalDbData = snapshot.val();
            if (selectedCustomerId) {
                renderCustomerLedger();
            }
        });

        // 3. Handle Customer Selection
        customerDropdown.addEventListener('change', (e) => {
            selectedCustomerId = e.target.value;
            const selectedText = customerDropdown.options[customerDropdown.selectedIndex].text;
            if (selectedCustomerId) {
                ledgerSection.classList.remove('hidden-section');
                selectedCustomerTitle.innerHTML = `<i class="fa-solid fa-book text-warning"></i> Ledger: <strong>${selectedText}</strong>`;
                renderCustomerLedger();
            }
        });

        // Render Ledger by pulling from customer_ledgers, receipts, and cash_in_hand
        function renderCustomerLedger() {
            ledgerTableBody.innerHTML = '';
            if (!globalDbData || !selectedCustomerId) {
                ledgerTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">No records found.</td></tr>`;
                return;
            }

            const customersMap = globalDbData.customers || {};
            const currentCust = customersMap[selectedCustomerId];
            if (!currentCust) return;

            const custNameLower = (currentCust.name || '').trim().toLowerCase();
            const custCodeLower = (currentCust.code || '').trim().toLowerCase();
            const fullCustTitleLower = `[${custCodeLower}] ${custNameLower}`;

            let transactions = [];

            // A. Read from customer_ledgers for this customer
            if (globalDbData.customer_ledgers && globalDbData.customer_ledgers[selectedCustomerId]) {
                const custLedger = globalDbData.customer_ledgers[selectedCustomerId];
                Object.keys(custLedger).forEach(tKey => {
                    const item = custLedger[tKey];
                    if (item && typeof item === 'object') {
                        const rec = parseFloat(item.amountReceived || item.received || 0) || 0;
                        const amt = parseFloat(item.amount || 0) || 0;
                        const hasMethod = item.method && item.method.trim() !== '' && item.method.trim() !== '-';

                        // Use amountReceived, or fallback to amount if a payment method (like Cash) was explicitly set
                        const finalRec = rec > 0 ? rec : (hasMethod ? amt : 0);

                        if (finalRec > 0) {
                            const { methodType, accountName } = extractMethodAndAccount(item.method, item.account);
                            transactions.push({
                                date: item.date || '',
                                description: item.description || 'Payment Received',
                                amountReceived: finalRec,
                                method: methodType,
                                account: accountName
                            });
                        }
                    }
                });
            }

            // B. Read from `receipts` matching this customer
            if (globalDbData.receipts) {
                Object.keys(globalDbData.receipts).forEach(rKey => {
                    const item = globalDbData.receipts[rKey];
                    if (item && typeof item === 'object') {
                        if (isCustomerMatch(item, selectedCustomerId, custNameLower, custCodeLower, fullCustTitleLower)) {
                            const rec = parseFloat(item.amountReceived || item.received || item.credit || item.amount || 0) || 0;
                            if (rec > 0) {
                                const { methodType, accountName } = extractMethodAndAccount(item.method, item.receiver || item.account);
                                transactions.push({
                                    date: item.date || '',
                                    description: item.description || item.particulars || 'Receipt Entry',
                                    amountReceived: rec,
                                    method: methodType,
                                    account: accountName
                                });
                            }
                        }
                    }
                });
            }

            // C. Read from `cash_in_hand` matching this customer
            if (globalDbData.cash_in_hand) {
                Object.keys(globalDbData.cash_in_hand).forEach(cKey => {
                    const item = globalDbData.cash_in_hand[cKey];
                    if (item && typeof item === 'object') {
                        if (isCustomerMatch(item, selectedCustomerId, custNameLower, custCodeLower, fullCustTitleLower)) {
                            const rec = parseFloat(item.amountReceived || item.received || item.deposit || item.amount || 0) || 0;
                            if (rec > 0) {
                                transactions.push({
                                    date: item.date || '',
                                    description: item.description || item.particulars || 'Cash Received',
                                    amountReceived: rec,
                                    method: 'Cash',
                                    account: 'Cash in Hand'
                                });
                            }
                        }
                    }
                });
            }

            // Sort chronologically by Date
            transactions.sort((a, b) => {
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });

            if (transactions.length > 0) {
                let runningTotal = 0;
                let index = 1;

                transactions.forEach(item => {
                    runningTotal += item.amountReceived;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="sr-col fw-bold">${index++}</td>
                        <td class="date-col">${formatDateToDisplay(item.date)}</td>
                        <td class="desc-col">${item.description}</td>
                        <td class="rec-col text-success fw-semibold">${item.amountReceived ? item.amountReceived.toLocaleString() : '-'}</td>
                        <td class="method-col fw-semibold">${item.method}</td>
                        <td class="acc-col">${item.account}</td>
                        <td class="rem-col fw-bold">${runningTotal.toLocaleString()}</td>
                    `;
                    ledgerTableBody.appendChild(tr);
                });
            } else {
                ledgerTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">No transactions found for this customer.</td></tr>`;
            }
        }
    </script>
</body>
</html>
