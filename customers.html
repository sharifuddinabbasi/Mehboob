<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Ledger - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: white;
            padding: 20px;
            border-bottom: 5px solid #ffc107;
        }
        .hidden-section {
            display: none !important;
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table th, table td {
            font-size: 12px !important;
            vertical-align: middle !important;
            padding: 6px 4px !important;
        }
        /* Strict compact widths */
        .sr-col { width: 4% !important; text-align: center; }
        .date-col { width: 11% !important; white-space: nowrap; }
        .date-col input { 
            font-size: 10px !important; 
            padding: 2px 2px !important; 
            width: 95px !important;
        }
        .desc-col { width: 29%; min-width: 150px; white-space: normal !important; word-break: break-word; }
        .amount-col { width: 9% !important; }
        .received-col { width: 9% !important; }
        .method-col { width: 18%; }
        .remarks-col { width: 12%; }
        .action-col { width: 9%; text-align: center; }

        /* Row hover & double-click selection prevention */
        #ledgerTableBody tr {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        #ledgerTableBody tr:hover {
            background-color: #eef2f5;
        }

        /* Excel-like inline editing row style */
        .inline-input {
            width: 100%;
            font-size: 11px;
            padding: 2px 4px;
            border: 1px solid #0d6efd;
            border-radius: 4px;
            background-color: #fff;
        }

        .footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-users text-warning"></i> Customer Ledger</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Content Section -->
    <div class="container-fluid my-4 px-3" style="max-width: 100%;">
        
        <!-- Dropdown Card to Select Customer -->
        <div class="card shadow-sm border-0 bg-white rounded-4 p-3 mb-3">
            <h5 class="fw-bold text-primary mb-2"><i class="fa-solid fa-list"></i> Select Customer</h5>
            <div class="mb-0">
                <label for="customerDropdown" class="form-label fw-semibold text-muted">Choose a customer from the list (Double-click any row to edit, click outside to auto-save):</label>
                <select class="form-select form-select-lg" id="customerDropdown">
                    <option value="" selected disabled>-- Select a Customer --</option>
                </select>
            </div>
        </div>

        <!-- Customer Ledger Table Section (Initially Hidden until a customer is selected) -->
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4 hidden-section" id="ledgerSection">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 text-truncate" id="selectedCustomerTitle"><i class="fa-solid fa-file-invoice-dollar"></i> Customer Transactions</h5>
            </div>
            
            <div class="table-responsive p-1">
                <table class="table table-bordered align-middle mb-0" style="min-width: 940px;">
                    <thead class="table-secondary text-center">
                        <tr>
                            <th class="sr-col">Sr.No.</th>
                            <th class="date-col">Date</th>
                            <th class="desc-col">Description</th>
                            <th class="amount-col">Amount</th>
                            <th class="received-col">Amount<br>Received</th>
                            <th class="method-col">Method</th>
                            <th class="remarks-col">Remarks</th>
                            <th class="action-col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerTableBody">
                        <!-- Dynamic records will load here -->
                    </tbody>
                    <!-- Add New Transaction Row Inside Table -->
                    <tfoot>
                        <tr class="table-light">
                            <form id="transactionForm">
                                <td class="text-center fw-bold sr-col" id="nextSNo">1</td>
                                <td class="date-col">
                                    <input type="date" class="form-control form-control-sm" id="transDate" required>
                                </td>
                                <td class="desc-col"><input type="text" class="form-control form-control-sm" id="transDesc" placeholder="Description" required></td>
                                <td class="amount-col"><input type="number" step="any" class="form-control form-control-sm" id="transAmount" placeholder="Amount"></td>
                                <td class="received-col"><input type="number" step="any" class="form-control form-control-sm" id="transReceived" placeholder="Received"></td>
                                <td class="method-col">
                                    <select class="form-select form-select-sm" id="transMethod" required>
                                        <option value="" selected disabled>-- Method --</option>
                                        <option value="Cash">Cash</option>
                                        <!-- Bank accounts populated dynamically -->
                                    </select>
                                </td>
                                <td class="remarks-col"><input type="text" class="form-control form-control-sm" id="transRemarks" placeholder="Remarks"></td>
                                <td class="text-center action-col">
                                    <button type="submit" class="btn btn-success btn-sm w-100 fw-semibold px-1" id="transSaveBtn">Add</button>
                                </td>
                            </form>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const customerDropdown = document.getElementById('customerDropdown');
        const ledgerSection = document.getElementById('ledgerSection');
        const selectedCustomerTitle = document.getElementById('selectedCustomerTitle');
        const ledgerTableBody = document.getElementById('ledgerTableBody');
        const transactionForm = document.getElementById('transactionForm');
        const transDate = document.getElementById('transDate');
        const transMethod = document.getElementById('transMethod');
        const nextSNo = document.getElementById('nextSNo');

        let currentCustomerKey = "";
        let bankAccountsList = [];
        let currentLedgerData = null;

        // Helper function to format date from yyyy-mm-dd to dd-mm-yyyy for display
        function formatDateToDisplay(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }

        // Render table function
        function renderLedgerTable() {
            ledgerTableBody.innerHTML = '';
            if (currentLedgerData) {
                let index = 1;
                Object.keys(currentLedgerData).forEach((lKey) => {
                    const item = currentLedgerData[lKey];
                    const displayDate = formatDateToDisplay(item.date);
                    const rowIndex = index++;

                    const row = document.createElement('tr');
                    row.id = `row_${lKey}`;
                    row.dataset.key = lKey;
                    row.dataset.index = rowIndex;
                    
                    // Direct double-click attribute for reliable desktop & mobile support
                    row.setAttribute('ondblclick', `enableRowEdit('${lKey}', ${rowIndex})`);

                    row.innerHTML = `
                        <td class="fw-bold text-center sr-col">${rowIndex}</td>
                        <td class="date-col text-center">${displayDate}</td>
                        <td class="desc-col">${item.description || '-'}</td>
                        <td class="fw-semibold amount-col">${item.amount || '-'}</td>
                        <td class="fw-semibold received-col">${item.amountReceived || '-'}</td>
                        <td class="method-col">${item.method || '-'}</td>
                        <td class="remarks-col">${item.remarks || '-'}</td>
                        <td class="text-center action-col" style="white-space: nowrap;">
                            <button type="button" class="btn btn-danger btn-sm px-2 py-1 fw-semibold" onclick="event.stopPropagation(); deleteTransaction('${currentCustomerKey}', '${lKey}')" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    `;
                    ledgerTableBody.appendChild(row);
                });
                nextSNo.textContent = index;
            } else {
                ledgerTableBody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-3">No records found. Add your first transaction below.</td></tr>`;
                nextSNo.textContent = 1;
            }
        }

        // Global function to enable inline editing on double click
        window.enableRowEdit = function(lKey, rowIndex) {
            const row = document.getElementById(`row_${lKey}`);
            if (!row || row.classList.contains('editing')) return;

            // If another row is currently being edited, save it first
            const existingEditRow = document.querySelector('tr.editing');
            if (existingEditRow && existingEditRow !== row) {
                const prevKey = existingEditRow.dataset.key;
                saveInlineEdit(currentCustomerKey, prevKey);
            }

            const item = currentLedgerData[lKey] || {};
            row.classList.add('editing');

            row.innerHTML = `
                <td class="fw-bold text-center sr-col">${rowIndex}</td>
                <td class="date-col"><input type="date" class="inline-input" id="edit_date_${lKey}" value="${item.date || ''}"></td>
                <td class="desc-col"><input type="text" class="inline-input" id="edit_desc_${lKey}" value="${item.description || ''}"></td>
                <td class="amount-col"><input type="number" step="any" class="inline-input" id="edit_amount_${lKey}" value="${item.amount || ''}"></td>
                <td class="received-col"><input type="number" step="any" class="inline-input" id="edit_received_${lKey}" value="${item.amountReceived || ''}"></td>
                <td class="method-col">
                    <select class="inline-input" id="edit_method_${lKey}">
                        <option value="Cash" ${item.method === 'Cash' ? 'selected' : ''}>Cash</option>
                        ${bankAccountsList.map(b => `<option value="${b}" ${item.method === b ? 'selected' : ''}>${b}</option>`).join('')}
                    </select>
                </td>
                <td class="remarks-col"><input type="text" class="inline-input" id="edit_remarks_${lKey}" value="${item.remarks || ''}"></td>
                <td class="text-center action-col" style="white-space: nowrap;">
                    <button type="button" class="btn btn-success btn-sm px-2 py-0 fw-semibold mb-1" onclick="event.stopPropagation(); saveInlineEdit('${currentCustomerKey}', '${lKey}')" title="Save"><i class="fa-solid fa-check"></i></button>
                    <button type="button" class="btn btn-secondary btn-sm px-2 py-0 fw-semibold" onclick="event.stopPropagation(); cancelInlineEdit()" title="Cancel"><i class="fa-solid fa-xmark"></i></button>
                </td>
            `;

            // Focus on the description input automatically & allow Enter key to save
            const descInput = document.getElementById(`edit_desc_${lKey}`);
            if (descInput) descInput.focus();

            const inputs = row.querySelectorAll('.inline-input');
            inputs.forEach(inp => {
                inp.addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter') {
                        ev.preventDefault();
                        saveInlineEdit(currentCustomerKey, lKey);
                    } else if (ev.key === 'Escape') {
                        cancelInlineEdit();
                    }
                });
            });
        };

        // 1. Load Bank Accounts for Method Dropdown
        onValue(ref(db, 'bank_accounts'), (snapshot) => {
            const data = snapshot.val();
            bankAccountsList = [];
            if (data) {
                Object.keys(data).forEach((key) => {
                    const b = data[key];
                    bankAccountsList.push(`${b.title} (${b.bankName})`);
                });
            }
            updateMethodDropdown();
        });

        function updateMethodDropdown() {
            transMethod.innerHTML = `
                <option value="" selected disabled>-- Method --</option>
                <option value="Cash">Cash</option>
            `;
            bankAccountsList.forEach(bank => {
                const opt = document.createElement('option');
                opt.value = bank;
                opt.textContent = bank;
                transMethod.appendChild(opt);
            });
        }

        // 2. Load Customers into Dropdown from Firebase
        onValue(ref(db, 'customers'), (snapshot) => {
            const data = snapshot.val();
            customerDropdown.innerHTML = '<option value="" selected disabled>-- Select a Customer --</option>';
            
            if (data) {
                Object.keys(data).forEach((key) => {
                    const c = data[key];
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `[${c.code}] ${c.name}`;
                    customerDropdown.appendChild(option);
                });
            } else {
                customerDropdown.innerHTML = '<option value="" selected disabled>No customers found</option>';
            }
        });

        // 3. When a customer is selected from dropdown
        customerDropdown.addEventListener('change', (e) => {
            currentCustomerKey = e.target.value;
            const customerNameText = customerDropdown.options[customerDropdown.selectedIndex].text;

            if (currentCustomerKey) {
                ledgerSection.classList.remove('hidden-section');
                selectedCustomerTitle.innerHTML = `<i class="fa-solid fa-file-invoice-dollar"></i> Ledger for: <strong>${customerNameText}</strong>`;
                
                // Fetch customer specific transactions from Firebase
                const ledgerRef = ref(db, `customer_ledgers/${currentCustomerKey}`);
                onValue(ledgerRef, (snapshot) => {
                    currentLedgerData = snapshot.val();
                    renderLedgerTable();
                });
            }
        });

        // Use mousedown instead of click so double-click creation doesn't falsely trigger outside-save on desktop
        document.addEventListener('mousedown', (event) => {
            const activeRow = document.querySelector('tr.editing');
            if (activeRow && !activeRow.contains(event.target)) {
                const transKey = activeRow.dataset.key;
                if (transKey) {
                    saveInlineEdit(currentCustomerKey, transKey);
                }
            }
        });

        // 4. Add New Transaction Form Submit
        transactionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!currentCustomerKey) {
                alert("Please select a customer first!");
                return;
            }

            const date = transDate.value;
            const description = document.getElementById('transDesc').value;
            const amount = document.getElementById('transAmount').value;
            const amountReceived = document.getElementById('transReceived').value;
            const method = transMethod.value;
            const remarks = document.getElementById('transRemarks').value;

            const transData = { date, description, amount, amountReceived, method, remarks };
            const ledgerRef = ref(db, `customer_ledgers/${currentCustomerKey}`);

            const newRef = push(ledgerRef);
            set(newRef, transData).then(() => {
                transactionForm.reset();
            }).catch((err) => alert(err.message));
        });

        // 5. Save Inline Edited Data directly into Firebase & force UI update
        window.saveInlineEdit = function(custKey, transKey) {
            const dateEl = document.getElementById(`edit_date_${transKey}`);
            if (!dateEl) return;

            const date = dateEl.value;
            const description = document.getElementById(`edit_desc_${transKey}`).value;
            const amount = document.getElementById(`edit_amount_${transKey}`).value;
            const amountReceived = document.getElementById(`edit_received_${transKey}`).value;
            const method = document.getElementById(`edit_method_${transKey}`).value;
            const remarks = document.getElementById(`edit_remarks_${transKey}`).value;

            const transData = { date, description, amount, amountReceived, method, remarks };

            // Update local data immediately so even if nothing changed, the inputs close cleanly
            if (currentLedgerData && currentLedgerData[transKey]) {
                currentLedgerData[transKey] = transData;
            }

            set(ref(db, `customer_ledgers/${custKey}/${transKey}`), transData).then(() => {
                renderLedgerTable();
            }).catch((err) => alert(err.message));
        };

        // 6. Cancel Inline Edit
        window.cancelInlineEdit = function() {
            renderLedgerTable();
        };

        // 7. Delete Transaction function globally available
        window.deleteTransaction = function(custKey, transKey) {
            if (confirm("Are you sure you want to delete this transaction?")) {
                remove(ref(db, `customer_ledgers/${custKey}/${transKey}`));
            }
        };
    </script>
</body>
</html>
