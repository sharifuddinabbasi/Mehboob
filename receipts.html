<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipts Account - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: white;
            padding: 20px;
            border-bottom: 5px solid #ffc107;
        }
        table th, table td {
            font-size: 12px !important;
            vertical-align: middle !important;
            padding: 6px 4px !important;
        }
        .footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-file-invoice-dollar text-warning"></i> Receipts Account</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Content Section -->
    <div class="container-fluid my-4 px-3" style="max-width: 1100px;">
        
        <!-- Add Receipt Form Card -->
        <div class="card shadow-sm border-0 bg-white rounded-4 p-4 mb-4">
            <h5 class="fw-bold text-success mb-3"><i class="fa-solid fa-plus-circle"></i> Add New Receipt</h5>
            <form id="receiptForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Date</label>
                        <input type="date" class="form-control" id="receiptDate" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Customer</label>
                        <select class="form-select" id="receiptCustomer" required>
                            <option value="" selected disabled>-- Select Customer --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Amount</label>
                        <input type="number" class="form-control" id="receiptAmount" placeholder="Enter amount" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Method</label>
                        <select class="form-select" id="receiptMethod" required>
                            <option value="Cash">Cash</option>
                            <option value="Cheque">Cheque</option>
                            <option value="Card">Card</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Accounts</label>
                        <select class="form-select" id="receiptAccount" required>
                            <option value="" selected disabled>-- Select Account --</option>
                            <option value="Cash in Hand">Cash in Hand</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Description</label>
                        <input type="text" class="form-control" id="receiptDesc" placeholder="Enter description">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100 fw-bold">Save</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Receipts Table Section -->
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0"><i class="fa-solid fa-book-open text-warning"></i> Receipts List</h5>
            </div>
            
            <div class="table-responsive p-1">
                <table class="table table-bordered table-striped align-middle mb-0" style="min-width: 850px;">
                    <thead class="table-secondary text-center">
                        <tr>
                            <th>Sr.No.</th>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Accounts</th>
                        </tr>
                    </thead>
                    <tbody id="receiptTableBody">
                        <tr><td colspan="7" class="text-center text-muted py-3">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('receiptDate').value = new Date().toISOString().split('T')[0];

        // Load Customers Dropdown
        onValue(ref(db, 'customers'), (snapshot) => {
            const data = snapshot.val();
            const custSelect = document.getElementById('receiptCustomer');
            custSelect.innerHTML = '<option value="" selected disabled>-- Select Customer --</option>';
            if (data) {
                Object.keys(data).forEach(k => {
                    const c = data[k];
                    const opt = document.createElement('option');
                    opt.value = `[${c.code || ''}] ${c.name}`;
                    opt.textContent = `[${c.code || ''}] ${c.name}`;
                    custSelect.appendChild(opt);
                });
            }
        });

        // Load Bank Accounts & Cash in Hand Dropdown
        onValue(ref(db, 'bank_accounts'), (snapshot) => {
            const data = snapshot.val();
            const accSelect = document.getElementById('receiptAccount');
            accSelect.innerHTML = '<option value="" selected disabled>-- Select Account --</option>';
            
            const cashOpt = document.createElement('option');
            cashOpt.value = "Cash in Hand";
            cashOpt.textContent = "Cash in Hand";
            accSelect.appendChild(cashOpt);

            if (data) {
                Object.keys(data).forEach(k => {
                    const b = data[k];
                    const opt = document.createElement('option');
                    opt.value = `${b.title} (${b.bankName})`;
                    opt.textContent = `${b.title} (${b.bankName})`;
                    accSelect.appendChild(opt);
                });
            }
        });

        // Submit Form
        document.getElementById('receiptForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newEntry = {
                date: document.getElementById('receiptDate').value,
                customer: document.getElementById('receiptCustomer').value,
                amount: parseFloat(document.getElementById('receiptAmount').value) || 0,
                method: document.getElementById('receiptMethod').value,
                account: document.getElementById('receiptAccount').value,
                description: document.getElementById('receiptDesc').value || 'Receipt'
            };

            push(ref(db, 'receipts'), newEntry).then(() => {
                document.getElementById('receiptForm').reset();
                document.getElementById('receiptDate').value = new Date().toISOString().split('T')[0];
            });
        });

        // Load Receipts Table
        onValue(ref(db, 'receipts'), (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('receiptTableBody');
            tbody.innerHTML = '';
            if (!data) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">No receipts found.</td></tr>`;
                return;
            }
            let index = 1;
            Object.keys(data).forEach(k => {
                const item = data[k];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center fw-bold">${index++}</td>
                    <td class="text-center">${item.date || '-'}</td>
                    <td>${item.description || '-'}</td>
                    <td>${item.customer || '-'}</td>
                    <td class="text-end text-success fw-semibold">${item.amount ? item.amount.toLocaleString() : '0'}</td>
                    <td class="text-center">${item.method || '-'}</td>
                    <td>${item.account || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
