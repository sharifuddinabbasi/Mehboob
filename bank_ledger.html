<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Ledger - Khan Petroleum Services Limited</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: white;
            padding: 20px;
            border-bottom: 5px solid #ffc107;
        }
        .hidden-section {
            display: none !important;
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table th, table td {
            font-size: 12px !important;
            vertical-align: middle !important;
            padding: 6px 4px !important;
        }
        /* Column Widths */
        .sr-col { width: 5% !important; text-align: center; }
        .date-col { width: 12% !important; white-space: nowrap; text-align: center; }
        .desc-col { width: 28%; min-width: 130px; white-space: normal !important; word-break: break-word; }
        .party-col { width: 25%; min-width: 130px; white-space: normal !important; word-break: break-word; }
        .deposit-col { width: 10% !important; text-align: right; }
        .withdraw-col { width: 10% !important; text-align: right; }
        .balance-col { width: 10% !important; text-align: right; }

        .footer {
            background-color: #212529;
            color: #adb5bd;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-section text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-building-columns text-warning"></i> Bank Ledger</h2>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4 btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Content Section -->
    <div class="container-fluid my-4 px-3" style="max-width: 1100px;">
        
        <!-- Select Bank Dropdown Card -->
        <div class="card shadow-sm border-0 bg-white rounded-4 p-3 mb-3">
            <h5 class="fw-bold text-primary mb-2"><i class="fa-solid fa-list-check"></i> Select Bank Account</h5>
            <div class="mb-0">
                <label for="bankDropdown" class="form-label fw-semibold text-muted">Choose a bank account from the list to view details:</label>
                <select class="form-select form-select-lg" id="bankDropdown">
                    <option value="" selected disabled>-- Select Bank Account --</option>
                </select>
            </div>
        </div>

        <!-- Bank Transactions Table Section -->
        <div class="card shadow-sm border-0 bg-white rounded-4 overflow-hidden mb-4 hidden-section" id="ledgerSection">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0 text-truncate" id="selectedBankTitle"><i class="fa-solid fa-book text-warning"></i> Bank Transactions</h5>
            </div>
            
            <div class="table-responsive p-1">
                <table class="table table-bordered table-striped align-middle mb-0" style="min-width: 900px;">
                    <thead class="table-secondary text-center">
                        <tr>
                            <th class="sr-col">Sr.No.</th>
                            <th class="date-col">Date</th>
                            <th class="desc-col">Description</th>
                            <th class="party-col">Party / Customer</th>
                            <th class="deposit-col">Deposit (In)</th>
                            <th class="withdraw-col">Withdraw (Out)</th>
                            <th class="balance-col">Balance</th>
                        </tr>
                    </thead>
                    <tbody id="bankTableBody">
                        <!-- Dynamic rows will load here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Khan Petroleum Services Limited. All Rights Reserved. By Mehboob Ali.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5BLPlTjaDBy6hmPeuedHtCnmcBQozLC4",
            authDomain: "khan-petroleum-service-abuja.firebaseapp.com",
            projectId: "khan-petroleum-service-abuja",
            storageBucket: "khan-petroleum-service-abuja.firebasestorage.app",
            messagingSenderId: "337162512372",
            appId: "1:337162512372:web:b6f0f2be3a6d0ee7163ba1",
            measurementId: "G-GVB8XSJNJX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const bankDropdown = document.getElementById('bankDropdown');
        const ledgerSection = document.getElementById('ledgerSection');
        const selectedBankTitle = document.getElementById('selectedBankTitle');
        const bankTableBody = document.getElementById('bankTableBody');

        let globalDbData = null;
        let selectedBankName = "";

        function formatDateToDisplay(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }

        // 1. Load Bank Accounts into Dropdown (Skipping the very first account index 0)
        onValue(ref(db, 'bank_accounts'), (snapshot) => {
            const data = snapshot.val();
            bankDropdown.innerHTML = '<option value="" selected disabled>-- Select Bank Account --</option>';
            if (data) {
                const keys = Object.keys(data);
                for (let i = 1; i < keys.length; i++) {
                    const key = keys[i];
                    const b = data[key];
                    const fullTitle = `${b.title} (${b.bankName})`;
                    const option = document.createElement('option');
                    option.value = fullTitle;
                    option.textContent = fullTitle;
                    bankDropdown.appendChild(option);
                }
            }
        });

        // 2. Listen to Database Live Updates
        onValue(ref(db, '/'), (snapshot) => {
            globalDbData = snapshot.val();
            if (selectedBankName) {
                renderBankLedger();
            }
        });

        // 3. Handle Bank Selection
        bankDropdown.addEventListener('change', (e) => {
            selectedBankName = e.target.value;
            if (selectedBankName) {
                ledgerSection.classList.remove('hidden-section');
                selectedBankTitle.innerHTML = `<i class="fa-solid fa-book text-warning"></i> Transactions for: <strong>${selectedBankName}</strong>`;
                renderBankLedger();
            }
        });

        // Render Bank Ledger Transactions
        function renderBankLedger() {
            bankTableBody.innerHTML = '';
            if (!globalDbData) return;

            let transactions = [];
            const searchName = selectedBankName.trim().toLowerCase();
            const isCashAccountSelected = searchName.includes('cash') || searchName === '';

            if (isCashAccountSelected) {
                const isCashAcc = (acc) => (acc || '').toLowerCase().includes('cash');

                if (globalDbData.receipts) {
                    Object.keys(globalDbData.receipts).forEach(rKey => {
                        const item = globalDbData.receipts[rKey];
                        if (item && isCashAcc(item.account) && (parseFloat(item.amount) || 0) > 0) {
                            transactions.push({
                                date: item.date || '',
                                description: item.description || 'Receipt Cash',
                                party: item.customer || '-',
                                deposit: parseFloat(item.amount),
                                withdraw: 0
                            });
                        }
                    });
                }

                if (globalDbData.payments) {
                    Object.keys(globalDbData.payments).forEach(pKey => {
                        const item = globalDbData.payments[pKey];
                        if (item && (parseFloat(item.amount) || 0) > 0) {
                            const acc = (item.account || '').toLowerCase();
                            const receiver = (item.receiver || '').toLowerCase();
                            const amt = parseFloat(item.amount);

                            if (!acc.includes('cash') && receiver.includes('cash')) {
                                transactions.push({
                                    date: item.date || '',
                                    description: item.description || 'Cash Withdrawal',
                                    party: item.account || 'Bank',
                                    deposit: amt,
                                    withdraw: 0
                                });
                            } else if (acc.includes('cash')) {
                                transactions.push({
                                    date: item.date || '',
                                    description: item.description || 'Payment Expense',
                                    party: item.receiver || '-',
                                    deposit: 0,
                                    withdraw: amt
                                });
                            }
                        }
                    });
                }
            } else {
                // Receipts into this Bank Account
                if (globalDbData.receipts) {
                    Object.keys(globalDbData.receipts).forEach(rKey => {
                        const item = globalDbData.receipts[rKey];
                        if (item && typeof item === 'object') {
                            const accStr = (item.account || item.receiver || '').trim().toLowerCase();
                            if (accStr && (accStr.includes(searchName) || searchName.includes(accStr))) {
                                const amt = parseFloat(item.amount) || 0;
                                if (amt > 0) {
                                    transactions.push({
                                        date: item.date || '',
                                        description: item.description || 'Receipt Deposit',
                                        party: item.customer || '-',
                                        deposit: amt,
                                        withdraw: 0
                                    });
                                }
                            }
                        }
                    });
                }

                // Payments from OR Transfers into this Bank Account
                if (globalDbData.payments) {
                    Object.keys(globalDbData.payments).forEach(pKey => {
                        const item = globalDbData.payments[pKey];
                        if (item && typeof item === 'object') {
                            const amt = parseFloat(item.amount) || 0;
                            if (amt > 0) {
                                const fromAccStr = (item.account || item.sender || '').trim().toLowerCase();
                                const toRecStr = (item.receiver || '').trim().toLowerCase();

                                // 1. If money was sent OUT from this bank account
                                if (fromAccStr && (fromAccStr.includes(searchName) || searchName.includes(fromAccStr))) {
                                    transactions.push({
                                        date: item.date || '',
                                        description: item.description || 'Payment Out',
                                        party: item.receiver || '-',
                                        deposit: 0,
                                        withdraw: amt
                                    });
                                }

                                // 2. If money was transferred IN to this bank account (as receiver)
                                if (toRecStr && (toRecStr.includes(searchName) || searchName.includes(toRecStr))) {
                                    transactions.push({
                                        date: item.date || '',
                                        description: item.description || 'Bank Transfer In',
                                        party: item.account || item.sender || '-',
                                        deposit: amt,
                                        withdraw: 0
                                    });
                                }
                            }
                        }
                    });
                }
            }

            transactions.sort((a, b) => {
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });

            if (transactions.length > 0) {
                let runningBalance = 0;
                let index = 1;

                transactions.forEach(t => {
                    runningBalance += (t.deposit - t.withdraw);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-center fw-bold sr-col">${index++}</td>
                        <td class="text-center date-col">${formatDateToDisplay(t.date)}</td>
                        <td class="desc-col">${t.description}</td>
                        <td class="party-col">${t.party}</td>
                        <td class="text-end text-success fw-semibold deposit-col">${t.deposit ? t.deposit.toLocaleString() : '-'}</td>
                        <td class="text-end text-danger fw-semibold withdraw-col">${t.withdraw ? t.withdraw.toLocaleString() : '-'}</td>
                        <td class="text-end fw-bold balance-col">${runningBalance.toLocaleString()}</td>
                    `;
                    bankTableBody.appendChild(tr);
                });
            } else {
                bankTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">No transactions found for this account.</td></tr>`;
            }
        }
    </script>
</body>
</html>
